# =============================================================================
# Smart Expense Pattern Analyzer — application.properties
# Phase 1: Build skeleton and Boot application
# =============================================================================

spring.application.name=smart-expense-analyzer

# =============================================================================
# DATASOURCE — H2 file-based persistent database (verbatim from spec §4.3)
# =============================================================================
spring.datasource.url=jdbc:h2:file:${user.home}/.smart-expense-analyzer/db;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.driver-class-name=org.h2.Driver

# =============================================================================
# JPA / Hibernate
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =============================================================================
# H2 Console — restricted to local development only (verbatim from spec §4.3)
# =============================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# =============================================================================
# Server
# =============================================================================
server.port=8080
